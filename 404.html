<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found — UPure</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#faf7f2;color:#1a1a16;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.box{max-width:520px}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-size:8rem;font-weight:300;color:#06471b;line-height:1;letter-spacing:-.02em;font-style:italic}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-weight:400;color:#48281b;margin:1rem 0 .85rem;letter-spacing:-.01em}
p{font-size:1rem;color:#4a4a40;line-height:1.65;margin-bottom:2rem;font-weight:300}
a{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.85rem;background:#06471b;color:#faf7f2;text-decoration:none;border-radius:8px;font-size:.78rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:transform .25s ease}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="box">
  <p class="num">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for has moved or doesn't exist. Let's get you back home.</p>
  <a href="/">← Back to UPure</a>
</div>
</body>
</html>
